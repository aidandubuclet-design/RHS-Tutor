<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tutor</title>
<style>
:root{--bg:#eef3f8;--grid:#d3dfec;--ink:#14213d;--mute:#52627a;--card:#fff;--line:#b9c8da;--red:#c0282d;--ok:#1b7a46;--okbg:#e3f4ea;--badbg:#fbe7e7;--hint:#fff6d6}
@media (prefers-color-scheme:dark){:root{--bg:#101826;--grid:#1b2740;--ink:#e6edf7;--mute:#9db0c9;--card:#17223a;--line:#33466a;--red:#ff7b7f;--ok:#6fdc9c;--okbg:#14352a;--badbg:#3b1f24;--hint:#3a3418}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:19px/1.55 -apple-system,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
main{max-width:820px;margin:0 auto;padding:22px 18px 70px}
h1{font-size:2.3rem;margin:0}
h2{font-size:1.2rem;margin:0 0 4px}
.sub{color:var(--mute);margin:2px 0 18px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:12px 18px;min-height:48px;touch-action:manipulation}
button.go{background:var(--ink);color:var(--bg);font-weight:700}
button.del{border-color:var(--red);color:var(--red)}
button:disabled{opacity:.45}
input[type=text],textarea{font:inherit;font-size:19px;padding:11px 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{height:120px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.slot{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.slot.empty{border-left-color:var(--line);border-style:dashed;color:var(--mute)}
.meta{color:var(--mute);font-size:.9em;margin:0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.prog{flex:1;min-width:100px;height:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
summary{cursor:pointer;font-weight:700;min-height:32px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:18px 20px}
.topic{color:var(--red);font-weight:700;margin:0 0 6px}
.q{white-space:pre-line;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:0 0 10px}
.opt.sel{border-width:4px}
.box{margin-top:14px;padding:12px 16px;border-radius:10px}
.box p{margin:5px 0}
.hint{background:var(--hint)}.good{background:var(--okbg)}.bad{background:var(--badbg)}
.note{font-size:.88em;color:var(--mute)}
</style></head><body><main id="app"></main>
<script>
const KEY="tutorLobby_v1",MAX=5;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s),app=$("#app");
let mem=null,storageOK=true;
const SEED={name:"AP Calculus BC: Unit 5",subject:"Analytical applications of derivatives",
concepts:["MVT: on [a,b] with f continuous and differentiable, some c has f'(c) = (f(b) - f(a))/(b - a).","Critical points: f' = 0 or f' does not exist.","Increasing/decreasing: f' > 0 or f' < 0. Only a sign change matters.","Extrema: f' goes + to - at a max, - to + at a min. Absolute extrema: compare f at critical points and endpoints.","Concavity: f'' > 0 concave up, f'' < 0 concave down. Inflection: f'' changes sign.","Second derivative test: f' = 0 and f'' > 0 is a min, f'' < 0 is a max.","Reading f': its zeros mark extrema of f. Its own max/min mark inflection points of f.","Optimization: sketch, one equation, differentiate, check endpoints, justify.","Implicit: differentiate both sides, treat y as y(x), attach dy/dx, solve."],
questions:[
{t:"5.1 Mean Value Theorem",type:"n",a:0.845,tol:0.002,q:"(Calculator) A particle's position is s(t) = t³ − 6t² + 9t + 1 for 0 ≤ t ≤ 4. At what time t in (0, 4) does the instantaneous velocity first equal the average velocity on [0, 4]?\nGive the smaller t, to 3 decimals.",h:"Average velocity = (s(4) − s(0)) / 4. Then solve s′(t) = that number.",w:"s(4) = 5, s(0) = 1, so average velocity = 1.\ns′(t) = 3t² − 12t + 9 = 1 → 3t² − 12t + 8 = 0.\nt = (12 ± √48)/6 ≈ 0.845 or 3.155. Smaller: 0.845."},
{t:"5.1 MVT with a table",type:"c",a:2,q:"f is twice differentiable with f″(x) > 0. f(2) = 10, f(4) = 13, f(6) = 19. Which could be f′(4)?",o:["1.2","1.5","2.2","3.0","3.4"],h:"Find the slope on [2,4] and on [4,6]. What does f″ > 0 say about f′?",w:"Slope on [2,4] = 1.5. Slope on [4,6] = 3.\nf″ > 0 means f′ is increasing, so 1.5 < f′(4) < 3. Only 2.2 fits."},
{t:"5.1 When MVT applies",type:"c",a:2,q:"Let f(x) = |x − 1| on [0, 3]. The average rate of change is 1/3. Does the MVT guarantee a c in (0, 3) with f′(c) = 1/3?",o:["Yes, f is continuous on [0, 3]","No, f is not continuous on [0, 3]","No, f is not differentiable on (0, 3)","No, the average rate of change is not zero"],h:"List the two MVT hypotheses. Does f satisfy both?",w:"MVT needs f continuous on [a,b] AND differentiable on (a,b).\nf has a corner at x = 1, inside the interval, so it fails differentiability and nothing is guaranteed."},
{t:"5.5 Candidates Test",type:"n",a:-25,tol:0.01,q:"Find the absolute minimum value of f(x) = x³ − 3x² − 9x + 2 on [0, 4].",h:"Solve f′ = 0, keep points inside [0, 4], compare f there and at both endpoints.",w:"f′ = 3(x − 3)(x + 1). Only x = 3 is in [0, 4].\nf(0) = 2, f(3) = −25, f(4) = −18. Smallest: −25."},
{t:"5.3 Increasing intervals",type:"c",a:1,q:"f′(x) = (x − 2)(x + 1)². On which interval is f increasing?",o:["x > −1","x > 2","x < −1 or x > 2","−1 < x < 2"],h:"Make a sign line for f′. What is the sign of (x + 1)² on each side of −1?",w:"(x + 1)² is never negative, so the sign comes from (x − 2): positive only for x > 2.\nAt x = −1, f′ = 0 but does not change sign, so it is not an extremum."},
{t:"5.4 First Derivative Test",type:"c",a:1,q:"h(x) > 0 for all x, and f′(x) = (x² − x − 6)h(x). Which is true?",o:["Relative max at x = 3, relative min at x = −2","Relative max at x = −2, relative min at x = 3","Relative minimum at both x = −2 and x = 3","It cannot be determined"],h:"Factor x² − x − 6. What does a positive h(x) do to the sign?",w:"(x − 3)(x + 2). Signs of f′: + for x < −2, − between, + for x > 3.\n+ to − at −2 is a max. − to + at 3 is a min."},
{t:"5.5 Max acceleration",type:"n",a:9,tol:0.01,q:"A particle has velocity v(t) = t³ − 6t² + 9t − 2 for 0 ≤ t ≤ 3. Find its maximum acceleration.",h:"a(t) = v′(t). Find where a′(t) = 0, then compare with the endpoints.",w:"a = 3t² − 12t + 9. a′ = 6t − 12 = 0 → t = 2.\na(0) = 9, a(2) = −3, a(3) = 0. Maximum: 9."},
{t:"5.6 Inflection and tangent line",type:"n",a:4,tol:0.01,q:"Find the y-intercept of the line tangent to y = x³ − 6x² + 9x − 4 at its point of inflection.",h:"Inflection: y″ = 0 with a sign change. You need the point AND the slope.",w:"y″ = 6x − 12 = 0 → x = 2.\ny(2) = −2, y′(2) = −3.\nTangent: y + 2 = −3(x − 2) → y = −3x + 4. Intercept: 4."},
{t:"5.6 Concavity from a DE",type:"n",a:4,tol:0.01,q:"Given dy/dx = xy, find d²y/dx² at (1, 2).",h:"Differentiate dy/dx = xy with the product rule. The derivative of y is dy/dx.",w:"d²y/dx² = y + x(dy/dx) = y + x(xy).\nAt (1, 2): 2 + 1·2 = 4."},
{t:"5.7 Second Derivative Test",type:"n",a:-11,tol:0.01,q:"Find the value of the local minimum of f(x) = x³ − 12x + 5.",h:"Solve f′ = 0, use f″ to classify. The question asks for the VALUE of f.",w:"f′ = 3x² − 12 → x = ±2. f″ = 6x.\nf″(2) = 12 > 0, so a min at x = 2. f(2) = 8 − 24 + 5 = −11."},
{t:"5.8 Reading the graph of f′",type:"c",a:1,q:"The graph of f′ is an upward-opening parabola crossing the x-axis at x = −1 and x = 3. At which x does f have a point of inflection?",o:["x = −1","x = 1","x = 3","There is none"],h:"Inflection points of f occur where f′ has a local max or min, not where it crosses the axis.",w:"The vertex of f′ is halfway between the roots, x = 1, so f″ changes − to + there.\nThe roots are where f has extrema (f′ changes sign)."},
{t:"5.11 Optimization",type:"n",a:32,tol:0.01,q:"A rectangle has its base on the x-axis and its top corners on y = 12 − x², symmetric about the y-axis. Find the maximum area.",h:"Right corner at x: width 2x, height 12 − x². Write A(x), differentiate.",w:"A = 2x(12 − x²) = 24x − 2x³. A′ = 24 − 6x² = 0 → x = 2.\nA″ = −12x < 0, so a max. A(2) = 48 − 16 = 32."},
{t:"5.12 Implicit slope",type:"n",a:-0.8,tol:0.01,q:"The curve x² + xy + y² = 7 passes through (1, 2). Find dy/dx there.",h:"Differentiate both sides. xy needs the product rule. Collect dy/dx terms.",w:"2x + y + x(dy/dx) + 2y(dy/dx) = 0\ndy/dx = −(2x + y)/(x + 2y). At (1, 2): −4/5 = −0.8."},
{t:"5.12 Related rates",type:"n",a:-3.75,tol:0.01,q:"x and y depend on t with x² + xy + y² = 7. When x = 1, y = 2, dy/dt = 3. Find dx/dt.",h:"Differentiate with respect to t. Every x and y term gets dx/dt or dy/dt.",w:"(dx/dt)(2x + y) + (dy/dt)(x + 2y) = 0\n(dx/dt)(4) + 3(5) = 0 → dx/dt = −15/4 = −3.75."}]};
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){storageOK=false}
 if(!s&&mem)s=mem;
 if(!s){s={tutors:[],prog:{}};add(s,SEED)}
 return s}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
function check1(t){if(!t||typeof t.name!=="string"||!Array.isArray(t.questions)||!t.questions.length)return"Needs a name and a questions list.";
 for(const [k,q] of t.questions.entries()){if(typeof q.q!=="string"||typeof q.w!=="string"||q.a===undefined||!["n","c"].includes(q.type))return"Question "+(k+1)+" is missing q, w, a, or a valid type (n or c).";
  if(q.type==="c"&&(!Array.isArray(q.o)||typeof q.a!=="number"||q.a<0||q.a>=q.o.length))return"Question "+(k+1)+" has bad choices."}
 return null}
function add(s,t){const id="t"+Date.now()+Math.floor(Math.random()*1e4);
 s.tutors.push({id,name:t.name,subject:t.subject||"",concepts:t.concepts||[],questions:t.questions.map(q=>({t:q.t||"",type:q.type,a:q.a,tol:q.tol||0.01,o:q.o,q:q.q,h:q.h||"No hint provided for this one.",w:q.w}))});
 s.prog[id]={i:0,res:[],best:null}}
let S=load(),cur=null,sel=null,locked=false,hinted=false;
function lobby(msg){cur=null;
 let h=`<h1>Tutor</h1><p class="sub">Pick a tutor to start. Up to ${MAX} slots.</p>`;
 if(!storageOK)h+=`<div class="box hint note">Progress can't be saved permanently in this viewer, so it will reset when you close the file. Try opening it in Safari or Documents by Readdle.</div>`;
 if(msg)h+=`<div class="box ${msg[0]?"good":"bad"}">${esc(msg[1])}</div>`;
 for(let k=0;k<MAX;k++){const t=S.tutors[k];
  if(t){const p=S.prog[t.id]||{i:0,res:[],best:null},n=t.questions.length,mid=p.i>0&&p.i<n;
   h+=`<div class="slot"><h2>${esc(t.name)}</h2><p class="meta">${esc(t.subject)}${t.subject?" · ":""}${n} questions${p.best!==null?" · best "+p.best+"/"+n+" unassisted":""}${mid?" · in progress ("+p.i+"/"+n+")":""}</p>
   <div class="row"><button class="go" data-go="${t.id}">${mid?"Resume":p.i>=n?"Retake":"Start"}</button>${mid?`<button data-re="${t.id}">Restart</button>`:""}<button class="del" data-del="${t.id}">Delete</button></div></div>`}
  else h+=`<div class="slot empty"><h2>Empty slot ${k+1}</h2><p class="meta">Import a tutor below to fill it.</p></div>`}
 h+=`<div class="slot"><h2>Import a tutor</h2><p class="meta">Ask Claude to build a tutor from your material (for example, your Physics C review). Claude will give you a tutor file. Choose that file here, or paste its text.</p>
 <div class="row"><input id="file" type="file" accept=".json,.txt,application/json,text/plain"></div>
 <div class="row"><textarea id="paste" placeholder="Or paste the tutor text here" aria-label="Paste tutor text"></textarea></div>
 <div class="row"><button class="go" id="imp">Import</button></div></div>`;
 app.innerHTML=h;
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>open(b.dataset.go));
 app.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>{S.prog[b.dataset.re]={i:0,res:[],best:S.prog[b.dataset.re].best};save();open(b.dataset.re)});
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const t=S.tutors.find(x=>x.id===b.dataset.del);if(confirm("Delete \""+t.name+"\" and its progress?")){S.tutors=S.tutors.filter(x=>x!==t);delete S.prog[t.id];save();lobby([1,"Deleted."])}});
 $("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#paste").value=r.result};r.readAsText(f)};
 $("#imp").onclick=doImport}
function doImport(){const raw=$("#paste").value.trim();if(!raw){lobby([0,"Choose a file or paste the tutor text first."]);return}
 let d;try{d=JSON.parse(raw)}catch(e){lobby([0,"That text isn't a valid tutor file. Make sure you copied all of it."]);return}
 const list=Array.isArray(d.tutors)?d.tutors:[d];let ok=0,err=null;
 for(const t of list){if(S.tutors.length>=MAX){err="All "+MAX+" slots are full. Delete one first.";break}
  const e=check1(t);if(e){err=e;break}add(S,t);ok++}
 save();lobby(ok&&!err?[1,"Imported "+ok+" tutor"+(ok>1?"s":"")+"."]:[0,(ok?"Imported "+ok+". ":"")+err])}
function open(id){cur=S.tutors.find(t=>t.id===id);const p=P();if(p.i>=cur.questions.length)S.prog[id]={i:0,res:[],best:p.best};render()}
function P(){return S.prog[cur.id]}
function header(){const n=cur.questions.length,c=P().res.filter(r=>r==="clean").length;
 return `<div class="bar"><button id="lb">← Lobby</button><span class="pill">${c} / ${n} unassisted</span><div class="prog"><i style="width:${P().res.length/n*100}%"></i></div></div>`}
function render(){const p=P(),n=cur.questions.length;sel=null;locked=false;hinted=false;
 if(p.i>=n)return summary();
 const q=cur.questions[p.i];
 const cs=cur.concepts.length?`<details><summary>Core ideas (optional)</summary>${cur.concepts.map(c=>{const k=c.indexOf(":");return `<p>${k>0&&k<40?"<b>"+esc(c.slice(0,k+1))+"</b>"+esc(c.slice(k+1)):esc(c)}</p>`}).join("")}</details>`:"";
 const inp=q.type==="c"?q.o.map((o,k)=>`<button class="opt" data-k="${k}">${"ABCDEF"[k]}. ${esc(o)}</button>`).join(""):`<div class="row" style="margin-top:0"><input type="text" id="ans" style="width:200px" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Your answer" aria-label="Your answer"><button id="neg">−</button><button id="slash">/</button></div><p class="note">Decimals and fractions like −3/4 both work.</p>`;
 app.innerHTML=header()+cs+`<div class="card"><p class="topic">Question ${p.i+1} of ${n}${q.t?": "+esc(q.t):""}</p><p class="q">${esc(q.q)}</p>${inp}<div class="row"><button class="go" id="sub">Check answer</button><button id="hb">I need a hint</button></div><div id="fb"></div></div>`;
 $("#lb").onclick=()=>lobby();
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;sel=+b.dataset.k;app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
 const a=$("#ans");if(a){a.onkeydown=e=>{if(e.key==="Enter")grade()};$("#neg").onclick=()=>{a.value+="−";a.focus()};$("#slash").onclick=()=>{a.value+="/";a.focus()}}
 $("#hb").onclick=()=>{if(locked)return;hinted=true;$("#fb").innerHTML=`<div class="box hint"><p><b>Hint.</b> ${esc(q.h)}</p><p>With a hint, this question won't count toward your score.</p></div>`};
 $("#sub").onclick=grade}
function num(s){s=s.trim().replace(/[−–]/g,"-");if(s.includes("/")){const[a,b]=s.split("/");return parseFloat(a)/parseFloat(b)}return parseFloat(s)}
function grade(){if(locked)return;const p=P(),q=cur.questions[p.i];let ok;
 if(q.type==="c"){if(sel===null){$("#fb").innerHTML=`<div class="box hint">Pick an answer first.</div>`;return}ok=sel===q.a}
 else{const v=num($("#ans").value);if(isNaN(v)){$("#fb").innerHTML=`<div class="box hint">Enter a number first.</div>`;return}ok=Math.abs(v-Number(q.a))<=q.tol}
 locked=true;let r,m,c;
 if(ok&&!hinted){r="clean";m="Correct with no help. This counts.";c="good"}
 else if(ok){r="assisted";m="Correct, but you used a hint, so it doesn't count. It's on your review list.";c="bad"}
 else{r="missed";m="Not quite. Here's how to get there. It doesn't count and goes on your review list.";c="bad"}
 p.res[p.i]=r;p.i++;save();
 const ans=q.type==="c"?"ABCDEF"[q.a]+". "+q.o[q.a]:q.a,last=p.i>=cur.questions.length;
 $("#fb").innerHTML=`<div class="box ${c}"><p><b>${m}</b></p><p>Answer: ${esc(ans)}</p><p style="white-space:pre-line">${esc(q.w)}</p></div><div class="row"><button class="go" id="nx">${last?"See results":"Next question"}</button></div>`;
 $("#nx").onclick=()=>{render();window.scrollTo(0,0)};$("#nx").focus()}
function summary(){const p=P(),n=cur.questions.length,c=p.res.filter(r=>r==="clean").length,pct=Math.round(c/n*100);
 if(p.best===null||c>p.best)p.best=c;save();
 const rev=cur.questions.filter((q,k)=>p.res[k]!=="clean").map(q=>`<li>${esc(q.t||q.q.slice(0,50))}</li>`).join("");
 app.innerHTML=header()+`<div class="card"><p class="topic">Results</p><p class="q"><b>${c} of ${n}</b> correct with no help (${pct}%).</p><p>${pct>=85?"Solid, independent understanding. You're ready for mixed practice.":"Not mastered yet, and that's useful to know. Re-read the walkthroughs below, then retake."}</p>${rev?`<p><b>Review list</b></p><ul>${rev}</ul>`:""}<div class="row"><button class="go" id="rt">Retake</button><button id="lb2">Back to lobby</button></div></div>`;
 $("#lb").onclick=$("#lb2").onclick=()=>lobby();
 $("#rt").onclick=()=>{S.prog[cur.id]={i:0,res:[],best:p.best};save();render()}}
lobby();
</script></body></html>
